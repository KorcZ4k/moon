<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido criado | Korczak Technologies</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="container"><section class="hero"><p class="eyebrow">Pedido registrado</p><h1>Seu pedido foi criado.</h1><p id="info" class="lead">Consultando pedido...</p><a class="btn btn-primary" href="../../area-cliente.html">Ir para a Área do Cliente</a></section></main><script type="module">import{API,authHeaders}from'../assets/js/core/app.js';const id=new URLSearchParams(location.search).get('id');if(!id)document.querySelector('#info').textContent='Pedido não identificado.';else fetch(`${API}/api/orders/${encodeURIComponent(id)}`,{headers:authHeaders()}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#info').textContent=`Pedido ${d.order.orderId}: ${d.order.productName} — ${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(d.order.amount)}. Status: ${d.order.status}.`}).catch(e=>document.querySelector('#info').textContent=e.message)</script></body></html>
