<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | Korczak Technologies</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><main class="container"><section class="hero"><p class="eyebrow">Pedido registrado</p><h1 id="title">Seu pedido foi criado.</h1><p id="info" class="lead">Consultando pedido...</p><div class="actions"><button id="pay" class="btn btn-primary" type="button">Ir para o pagamento</button><a class="btn" href="../../area-cliente.html">Área do Cliente</a></div><p id="status" class="status" aria-live="polite"></p></section></main><script type="module">import{API,authHeaders,isAuthenticated,redirectToLogin}from'../assets/js/core/app.js';const qs=new URLSearchParams(location.search),id=qs.get('id'),info=document.querySelector('#info'),status=document.querySelector('#status'),pay=document.querySelector('#pay');let order=null;if(!id){info.textContent='Pedido não identificado.';pay.hidden=true}else if(!isAuthenticated()){redirectToLogin(location.href)}else{load()}async function load(){try{const r=await fetch(`${API}/api/orders/${encodeURIComponent(id)}`,{headers:authHeaders()}),d=await r.json();if(r.status===401||r.status===403){redirectToLogin(location.href);return}if(!r.ok)throw Error(d.error||'Não foi possível consultar o pedido.');order=d.order;info.textContent=`Pedido ${order.orderId}: ${order.productName} — ${new Intl.NumberFormat('pt-BR',{style:'currency',currency:order.currency||'BRL'}).format(order.amount)}.`;if(['paid','processing','completed'].includes(order.status)){pay.hidden=true;status.textContent=`Status atual: ${order.status}.`}else if(qs.get('payment')==='failure'){status.textContent='O pagamento não foi concluído. Você pode tentar novamente.'}else if(qs.get('payment')==='pending'){status.textContent='O pagamento está pendente de confirmação.'}else{status.textContent='Aguardando pagamento.'}}catch(e){info.textContent=e.message;pay.hidden=true}}pay.addEventListener('click',async()=>{if(!order)return;pay.disabled=true;status.textContent='Preparando checkout seguro...';try{const r=await fetch(`${API}/api/orders/${encodeURIComponent(order.orderId)}/checkout`,{method:'POST',headers:authHeaders()}),d=await r.json();if(r.status===401||r.status===403){redirectToLogin(location.href);return}if(!r.ok)throw Error(d.error||'Não foi possível iniciar o pagamento.');if(!d.checkoutUrl)throw Error('O provedor não retornou a página de pagamento.');location.href=d.checkoutUrl}catch(e){status.textContent=e.message;pay.disabled=false}})</script></body></html>
