<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de pagamento Pix | Korczak Technologies</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="container"><section class="hero"><p class="eyebrow">AMBIENTE DE TESTE</p><h1>Simular pagamento via Pix.</h1><p id="info" class="lead">Nenhum dado bancário real é solicitado e nenhum dinheiro será transferido.</p><div class="actions"><button id="send" class="btn btn-primary" type="button">Enviar Pix de teste</button><a id="back" class="btn" href="index.html">Voltar ao pedido</a></div><p id="status" class="status" aria-live="polite"></p></section></main><script>const q=new URLSearchParams(location.search),id=q.get('id'),info=document.querySelector('#info'),status=document.querySelector('#status'),send=document.querySelector('#send'),back=document.querySelector('#back');if(!id){info.textContent='Pedido de teste não identificado.';send.disabled=true}else{info.textContent=`Pedido ${id}. Esta é apenas uma simulação local do fluxo Pix; nenhum valor será cobrado.`;back.href=`confirmacao.html?id=${encodeURIComponent(id)}`;}send.addEventListener('click',()=>{if(!id)return;send.disabled=true;status.textContent='Processando pagamento de teste...';setTimeout(()=>{const receipt={orderId:id,provider:'pix_test',status:'approved',simulated:true,paidAt:new Date().toISOString()};localStorage.setItem(`kz_test_payment_${id}`,JSON.stringify(receipt));status.textContent='Pix de teste aprovado. Nenhum dinheiro foi movimentado.';send.textContent='Pagamento de teste aprovado';},700);});</script></body></html>
