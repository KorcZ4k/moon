<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crie um pedido comercial na Korczak Technologies."><title>Pedido | Korczak Technologies</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="container"><section class="hero"><p class="eyebrow">Pedido</p><h1>Confirme seu pedido.</h1><p class="lead">Para concluir a compra, é necessário estar logado na Área do Cliente.</p><form id="orderForm"><label>Produto<select id="product" name="product"></select></label><label>Detalhes do projeto<textarea name="details" placeholder="Explique qualquer requisito importante."></textarea></label><button class="btn btn-primary" type="submit">Criar pedido</button><p id="status" class="status" aria-live="polite"></p></form></section></main><script type="module">import{API,isAuthenticated,redirectToLogin,authHeaders}from'../assets/js/core/app.js';const products={"discord-essential":{name:'Bot Discord Essencial',price:150},"discord-community":{name:'Bot Discord Comunidade',price:300},"site-essential":{name:'Site Essencial',price:250},"site-institutional":{name:'Site Institucional',price:500},"landing-essential":{name:'Landing Page Essencial',price:150}};const select=document.querySelector('#product'),chosen=new URLSearchParams(location.search).get('product');Object.entries(products).forEach(([id,p])=>{const o=new Option(`${p.name} — R$ ${p.price.toFixed(2)}`,id,id===chosen,id===chosen);select.add(o)});document.querySelector('#orderForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status'),product=select.value;if(!isAuthenticated()){status.textContent='Você precisa fazer login para continuar.';redirectToLogin(location.href);return}status.textContent='Criando pedido...';try{const r=await fetch(`${API}/api/orders`,{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({product,details:e.target.details.value})}),data=await r.json();if(r.status===401||r.status===403){redirectToLogin(location.href);return}if(!r.ok)throw Error(data.error||'Não foi possível criar o pedido.');location.href=`confirmacao.html?id=${encodeURIComponent(data.order.orderId)}`}catch(err){status.textContent=err.message}})</script></body></html>
