services:
  - type: web
    name: korczak-technologies-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: KEEPALIVE_URL
        sync: false
