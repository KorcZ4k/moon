<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Korczak Technologies</title><link rel="stylesheet" href="style.css"></head><body class="inner-page auth-page"><main class="auth-main"><section class="auth-shell"><div class="auth-intro"><div class="auth-monogram">KZ</div><p class="tag">ÁREA DO CLIENTE</p><h1>Acesse sua<br><span>conta.</span></h1><p class="lead">Entre com seu e-mail e senha ou crie uma conta.</p></div><div class="auth-card"><div class="auth-tabs"><button class="auth-tab active" type="button" data-auth-target="signin">Entrar</button><button class="auth-tab" type="button" data-auth-target="signup">Cadastrar</button></div><form id="signin-form" class="auth-form active" data-auth-form="signin"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary form-button" type="submit">Entrar</button><p class="form-message" hidden></p></form><form id="signup-form" class="auth-form" data-auth-form="signup"><div class="auth-grid"><label>Nome<input name="nome" autocomplete="given-name" required></label><label>Sobrenome<input name="sobrenome" autocomplete="family-name" required></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="senha" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar senha<input name="confirmarSenha" type="password" autocomplete="new-password" minlength="8" required></label></div><button class="primary form-button" type="submit">Criar conta</button><p class="form-message" hidden></p></form></div></section></main><script src="app.js"></script></body></html>
